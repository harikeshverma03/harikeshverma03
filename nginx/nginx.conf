server {
    listen 80;
    server_name harikeshverma03.com;

    location /api/ {
        proxy_pass http://localhost:8081/api/;
        proxy_set_header Host $host;
    }

    # Redirect /github → GitHub profile
    location = /github {
        return 301 https://github.com/harikeshverma03;
    }

    # Optional: handle trailing slash
    location = /github/ {
        return 301 https://github.com/harikeshverma03;
    }

    # Redirect /linkedin → LinkedIn profile
    location = /linkedin {
        return 301 https://www.linkedin.com/in/harikeshverma03/;
    }

    # Optional: handle trailing slash
    location = /linkedin/ {
        return 301 https://www.linkedin.com/in/harikeshverma03/;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
    }
}
